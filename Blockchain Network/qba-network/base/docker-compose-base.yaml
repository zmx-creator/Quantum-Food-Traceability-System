version: '2'
services:
  orderer0.example.com:
    container_name: orderer0.example.com
    extends:
      file: peer-base.yaml
      service: orderer-base
    environment:
        - ORDERER_GENERAL_LISTENPORT=6050
        - PBFT_LISTEN_PORT=6070
        - PBFT_NODE_ID=0
        - PBFT_NODE_TABLE=http://orderer0.example.com:6070;http://orderer1.example.com:6071;http://orderer2.example.com:6072;http://orderer3.example.com:6073;http://orderer4.example.com:6074
    volumes:
        - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer0.example.com/msp:/var/hyperledger/orderer/msp
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer0.example.com/tls:/var/hyperledger/orderer/tls
        - ../production/orderer:/var/hyperledger/production/orderer0
        - ../QBAKey:/QBAKey
    ports:
      - 6050:6050
      - 6070:6070

  orderer1.example.com:
    container_name: orderer1.example.com
    extends:
      file: peer-base.yaml
      service: orderer-base
    environment:
        - ORDERER_GENERAL_LISTENPORT=6051
        - PBFT_LISTEN_PORT=6071
        - PBFT_NODE_ID=1
        - PBFT_NODE_TABLE=http://orderer0.example.com:6070;http://orderer1.example.com:6071;http://orderer2.example.com:6072;http://orderer3.example.com:6073;http://orderer4.example.com:6074
    volumes:
        - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/msp:/var/hyperledger/orderer/msp
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer1.example.com/tls:/var/hyperledger/orderer/tls
        - ../production/orderer:/var/hyperledger/production/orderer1
        - ../QBAKey:/QBAKey
    ports:
      - 6051:6051
      - 6071:6071

  orderer2.example.com:
    container_name: orderer2.example.com
    extends:
      file: peer-base.yaml
      service: orderer-base
    environment:
        - ORDERER_GENERAL_LISTENPORT=6052
        - PBFT_LISTEN_PORT=6072
        - PBFT_NODE_ID=2
        - PBFT_NODE_TABLE=http://orderer0.example.com:6070;http://orderer1.example.com:6071;http://orderer2.example.com:6072;http://orderer3.example.com:6073;http://orderer4.example.com:6074
    volumes:
        - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/msp:/var/hyperledger/orderer/msp
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer2.example.com/tls:/var/hyperledger/orderer/tls
        - ../production/orderer:/var/hyperledger/production/orderer2
        - ../QBAKey:/QBAKey
    ports:
      - 6052:6052
      - 6072:6072

  orderer3.example.com:
    container_name: orderer3.example.com
    extends:
      file: peer-base.yaml
      service: orderer-base
    environment:
        - ORDERER_GENERAL_LISTENPORT=6053
        - PBFT_LISTEN_PORT=6073
        - PBFT_NODE_ID=3
        - PBFT_NODE_TABLE=http://orderer0.example.com:6070;http://orderer1.example.com:6071;http://orderer2.example.com:6072;http://orderer3.example.com:6073;http://orderer4.example.com:6074
    volumes:
        - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/msp:/var/hyperledger/orderer/msp
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer3.example.com/tls:/var/hyperledger/orderer/tls
        - ../production/orderer:/var/hyperledger/production/orderer3
        - ../QBAKey:/QBAKey
    ports:
      - 6053:6053
      - 6073:6073

  orderer4.example.com:
    container_name: orderer4.example.com
    extends:
      file: peer-base.yaml
      service: orderer-base
    environment:
        - ORDERER_GENERAL_LISTENPORT=6054
        - PBFT_LISTEN_PORT=6074
        - PBFT_NODE_ID=4
        - PBFT_NODE_TABLE=http://orderer0.example.com:6070;http://orderer1.example.com:6071;http://orderer2.example.com:6072;http://orderer3.example.com:6073;http://orderer4.example.com:6074
    volumes:
        - ../channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer4.example.com/msp:/var/hyperledger/orderer/msp
        - ../crypto-config/ordererOrganizations/example.com/orderers/orderer4.example.com/tls:/var/hyperledger/orderer/tls
